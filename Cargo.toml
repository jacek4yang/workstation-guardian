[workspace]
resolver = "2"
members = [
    "crates/guardian-proto",
    "crates/guardian-core",
    "crates/guardian-storage",
    "crates/guardian-win",
    "crates/guardian-process",
    "crates/guardian-network",
    "crates/guardian-update",
    "crates/guardian-service",
    "apps/guardian-session",
    "apps/guardianctl",
    "apps/guardian-ui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["Workstation Guardian contributors"]
repository = "https://example.invalid/workstation-guardian"

[workspace.dependencies]
# Internal crates
guardian-proto = { path = "crates/guardian-proto" }
guardian-core = { path = "crates/guardian-core" }
guardian-storage = { path = "crates/guardian-storage" }
guardian-win = { path = "crates/guardian-win" }
guardian-process = { path = "crates/guardian-process" }
guardian-network = { path = "crates/guardian-network" }
guardian-update = { path = "crates/guardian-update" }
guardian-service = { path = "crates/guardian-service" }

# Windows
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Services",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Shutdown",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_NetworkManagement_Rras",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinInet",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_Security_Credentials",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }
windows-service = "0.8"

# Async / runtime
tokio = { version = "1.53", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Errors / misc
thiserror = "2.0"
regex = "1.13"
uuid = { version = "1.26", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros", "serde-well-known", "parsing"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.release.package."*"]
opt-level = 2

# Tests must be able to catch panics in worker code.
[profile.dev]
panic = "unwind"
